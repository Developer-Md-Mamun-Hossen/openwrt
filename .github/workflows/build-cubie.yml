name: Debug - Isolate uboot-sunxi build error

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free up GitHub runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget quilt cpio libyaml-dev pkg-config

      - name: Fix missing libyaml pkg-config file (Ubuntu libyaml-dev packaging gap)
        run: |
          MULTIARCH=$(dpkg-architecture -qDEB_HOST_MULTIARCH)
          LIBDIR="/usr/lib/$MULTIARCH"
          sudo mkdir -p "$LIBDIR/pkgconfig"
          cat <<EOF | sudo tee "$LIBDIR/pkgconfig/yaml-0.1.pc" > /dev/null
          prefix=/usr
          exec_prefix=\${prefix}
          libdir=$LIBDIR
          includedir=\${prefix}/include

          Name: yaml-0.1
          Description: YAML 1.1 parser and emitter library
          Version: 0.1
          Libs: -L\${libdir} -lyaml
          Cflags: -I\${includedir}
          EOF
          echo "Verifying pkg-config now finds yaml-0.1:"
          pkg-config --exists yaml-0.1 && pkg-config --libs yaml-0.1 || { echo "::error::pkg-config still can't find yaml-0.1"; exit 1; }

      - name: Checkout Developer PR Branch Directly (pinned to pre-Avaota commit)
        uses: actions/checkout@v4
        with:
          repository: wigyori/openwrt
          ref: 442c6c8256be6c77b5c6af55332bc2e6ec26a720

      - name: Show exact commit being built
        run: git log -1 --format="%H %s (%ci)"

      - name: Confirm Cubie A5E U-Boot block is present (unmodified from upstream)
        run: |
          grep -A6 "U-Boot/radxa-cubie-a5e" package/boot/uboot-sunxi/Makefile || {
            echo "::error::radxa-cubie-a5e U-Boot definition not found in upstream Makefile"
            exit 1
          }

      - name: Minimal config - target only, no extra packages
        run: |
          echo "CONFIG_TARGET_sunxi=y" > .config
          echo "CONFIG_TARGET_sunxi_cortexa55=y" >> .config
          echo "CONFIG_TARGET_sunxi_cortexa55_DEVICE_radxa_cubie-a5e=y" >> .config
          make defconfig

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Download uboot-sunxi source
        run: make package/boot/uboot-sunxi/download V=s

      - name: Build ONLY uboot-sunxi with full verbosity (the real test)
        run: make package/boot/uboot-sunxi/compile V=s 2>&1 | tee uboot_only.log

      - name: Upload isolated uboot build log (always, pass or fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uboot-only-log
          path: uboot_only.log
